  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="180" fill="rgba(0,240,255,0.08)" filter="url(#glow)"/>
  <circle cx="1050" cy="500" r="220" fill="rgba(251,188,5,0.06)" filter="url(#glow)"/>

  <!-- Top App Bar -->
