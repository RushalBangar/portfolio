  <rect x="900" y="300" width="200" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="900" y="300" width="192" height="5" rx="2.5" fill="#00f0ff"/>

  <rect x="885" y="340" width="230" height="110" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(251,188,5,0.25)" stroke-width="1"/>
  <text x="900" y="367" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ayushman Bharat</text>
  <text x="900" y="387" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="11">PM-JAY Health Coverage</text>
  <text x="900" y="415" fill="#fbbc05" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="800">91% Match</text>
  <rect x="900" y="425" width="200" height="5" rx="2.5" fill="rgba(255,255,255,0.1)"/>
  <rect x="900" y="425" width="182" height="5" rx="2.5" fill="#fbbc05"/>

  <rect x="885" y="465" width="230" height="130" rx="12" fill="rgba(0,240,255,0.06)" stroke="rgba(0,240,255,0.3)" stroke-width="1"/>
  <text x="900" y="495" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Multilingual Voice Mode</text>
  <text x="900" y="515" fill="rgba(255,255,255,0.55)" font-family="system-ui, sans-serif" font-size="11">Marathi &#x2022; Hindi &#x2022; English</text>
  <rect x="900" y="535" width="200" height="36" rx="18" fill="url(#cyan-p)"/>
  <text x="940" y="558" fill="#000000" font-family="system-ui, sans-serif" font-size="12" font-weight="700">&#x1F399; Voice Assistance</text>
</svg>
