<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="gk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a050f"/>
      <stop offset="50%" stop-color="#12081f"/>
      <stop offset="100%" stop-color="#040208"/>
    </linearGradient>
    <linearGradient id="magenta-p" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2a7a"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>
    <linearGradient id="emerald-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <filter id="gk-glow">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#gk-bg)"/>
  
  <!-- Ambient glow -->
  <circle cx="280" cy="240" r="220" fill="rgba(255,42,122,0.08)" filter="url(#gk-glow)"/>
  <circle cx="980" cy="450" r="220" fill="rgba(0,230,118,0.06)" filter="url(#gk-glow)"/>

  <!-- Top App Header -->
  <rect x="60" y="45" width="1080" height="56" rx="14" fill="rgba(20,10,30,0.85)" stroke="rgba(255,42,122,0.25)" stroke-width="1"/>
  <circle cx="95" cy="73" r="6" fill="#ff5f56"/>
  <circle cx="115" cy="73" r="6" fill="#ffbd2e"/>
  <circle cx="135" cy="73" r="6" fill="#27c93f"/>

  <text x="175" y="79" fill="#ff2a7a" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="2">GRAHAK-KAVACH</text>
  <text x="360" y="78" fill="rgba(255,255,255,0.4)" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" letter-spacing="1">// AI LEGAL METROLOGY &amp; CONSUMER DEFENSE</text>

  <rect x="910" y="58" width="200" height="30" rx="15" fill="rgba(0,230,118,0.12)" stroke="rgba(0,230,118,0.4)" stroke-width="1"/>
  <circle cx="928" cy="73" r="4" fill="#00e676"/>
  <text x="942" y="78" fill="#00e676" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CV OCR SCANNER LIVE</text>

  <!-- Left: Computer Vision OCR Bounding Box Label -->
  <rect x="60" y="125" width="440" height="495" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,42,122,0.2)" stroke-width="1"/>
  <text x="90" y="165" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700">Package Label OCR Feed</text>
  <text x="90" y="185" fill="#ff2a7a" font-family="system-ui, sans-serif" font-size="12">Multimodal Visual Feature Extraction</text>

  <!-- Product Label Simulation -->
  <rect x="90" y="210" width="380" height="380" rx="12" fill="rgba(10,5,15,0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- OCR Scan Line animation visual -->
  <line x1="90" y1="290" x2="470" y2="290" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <rect x="90" y="270" width="380" height="40" fill="rgba(0,240,255,0.06)"/>

  <!-- OCR Detection Box 1: MRP & Net Weight -->
  <rect x="110" y="235" width="340" height="48" rx="6" fill="rgba(0,230,118,0.08)" stroke="#00e676" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="110" y="222" width="130" height="15" rx="3" fill="#00e676"/>
  <text x="115" y="233" fill="#000000" font-family="system-ui, sans-serif" font-size="9" font-weight="800">LEGAL METROLOGY OK</text>
  <text x="125" y="265" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700">Net Wt: 400g | MRP &#x20B9;145.00 (Incl. Taxes)</text>

  <!-- OCR Detection Box 2: Manufacturing Date & Expiry -->
  <rect x="110" y="305" width="340" height="48" rx="6" fill="rgba(0,230,118,0.08)" stroke="#00e676" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="110" y="292" width="110" height="15" rx="3" fill="#00e676"/>
  <text x="115" y="303" fill="#000000" font-family="system-ui, sans-serif" font-size="9" font-weight="800">DATE VALIDATED</text>
  <text x="125" y="335" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700">MFG: 08/2026 | USE BY: 08/2027</text>

  <!-- OCR Detection Box 3: Ingredient Breakdown -->
  <rect x="110" y="375" width="340" height="110" rx="6" fill="rgba(255,42,122,0.08)" stroke="#ff2a7a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="110" y="362" width="145" height="15" rx="3" fill="#ff2a7a"/>
  <text x="115" y="373" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800">INGREDIENTS OCR</text>
  <text x="125" y="405" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="12">Wheat Flour (62%), Palm Olein, Cane Sugar,</text>
  <text x="125" y="425" fill="rgba(255,255,255,0.85)" font-family="system-ui, sans-serif" font-size="12">Malt Extract, INS 500(ii), INS 503(ii), Salt.</text>
  <text x="125" y="455" fill="#ffbd2e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">&#x26A0; Allergen Notice: Contains Gluten &amp; Sulphites</text>

  <rect x="110" y="505" width="340" height="65" rx="8" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="130" y="533" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Scan Resolution &amp; Quality</text>
  <text x="130" y="555" fill="#00e676" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700">99.2% OCR Confidence Score</text>

  <!-- Center & Right: Compliance Dashboard -->
  <rect x="530" y="125" width="610" height="495" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <text x="560" y="165" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" font-weight="700">Audit &amp; Evidence Engine</text>
  <text x="560" y="185" fill="rgba(255,255,255,0.45)" font-family="system-ui, sans-serif" font-size="12">FSSAI Regulations 2026 &amp; Consumer Protection Act</text>

  <!-- Score Card -->
  <rect x="560" y="215" width="270" height="150" rx="14" fill="rgba(0,230,118,0.06)" stroke="rgba(0,230,118,0.3)" stroke-width="1"/>
  <text x="585" y="248" fill="#00e676" font-family="system-ui, sans-serif" font-size="12" font-weight="700">OVERALL SAFETY SCORE</text>
  <text x="585" y="305" fill="#00e676" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="900">94.8<tspan font-size="24">%</tspan></text>
  <text x="585" y="338" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="12">&#x2713; Full Legal Metrology Compliance</text>

  <!-- Risk Breakdown -->
  <rect x="850" y="215" width="260" height="150" rx="14" fill="rgba(255,42,122,0.06)" stroke="rgba(255,42,122,0.3)" stroke-width="1"/>
  <text x="875" y="248" fill="#ff2a7a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RISK METRICS</text>
  <text x="875" y="278" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Sugar Ratio: <tspan fill="#ffbd2e" font-weight="700">Moderate (18g/100g)</tspan></text>
  <text x="875" y="304" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Sodium Level: <tspan fill="#00e676" font-weight="700">Safe (210mg)</tspan></text>
  <text x="875" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Additives: <tspan fill="#00e676" font-weight="700">Permitted Class II</tspan></text>
  <text x="875" y="352" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Trans Fats: <tspan fill="#00e676" font-weight="700">0.0g (Verified)</tspan></text>

  <!-- Compliance Checklist Table -->
  <rect x="560" y="385" width="550" height="140" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="585" y="415" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700">Mandatory Label Declarations</text>
  
  <text x="585" y="445" fill="#00e676" font-family="system-ui, sans-serif" font-size="12">&#x2713; Veg/Non-Veg Green Dot Symbol Detected &amp; Certified</text>
  <text x="585" y="470" fill="#00e676" font-family="system-ui, sans-serif" font-size="12">&#x2713; FSSAI License Number (14-Digit Format: Valid)</text>
  <text x="585" y="495" fill="#00e676" font-family="system-ui, sans-serif" font-size="12">&#x2713; Customer Care Details &amp; Batch No. Present</text>

  <!-- Action Bar -->
  <rect x="560" y="545" width="280" height="50" rx="14" fill="url(#magenta-p)"/>
  <text x="615" y="576" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700">&#x1F4CB; Generate Legal Audit PDF</text>

  <rect x="860" y="545" width="250" height="50" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="900" y="576" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600">&#x26A0; Report Infringement</text>
</svg>
